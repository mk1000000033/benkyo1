<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="720" height="240" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="360" height="120" fill="#ffffff"/>
<text x="180" y="20" font-size="13" font-weight="900" fill="#3d3a50" text-anchor="middle">BMI ＝ 体重(kg) ÷ 身長(m)²</text>
<g font-weight="900">
<rect x="10" y="40" width="84" height="34" fill="#5aa9e6"/><text x="52" y="62" font-size="14" fill="#fff" text-anchor="middle">やせ</text>
<rect x="94" y="40" width="156" height="34" fill="#9fd8c4"/><text x="136" y="62" font-size="14" fill="#3d3a50" text-anchor="middle">ふつう</text>
<rect x="250" y="40" width="100" height="34" fill="#e0558a"/><text x="300" y="62" font-size="14" fill="#fff" text-anchor="middle">肥満</text>
<line x1="94" y1="36" x2="94" y2="80" stroke="#3d3a50" stroke-width="2"/><text x="94" y="96" font-size="13" fill="#3d3a50" text-anchor="middle">18.5</text>
<line x1="178" y1="34" x2="178" y2="80" stroke="#3d3a50" stroke-width="3" stroke-dasharray="4 3"/><text x="178" y="98" font-size="15" fill="#e0558a" text-anchor="middle">22 🎯</text>
<line x1="250" y1="36" x2="250" y2="80" stroke="#3d3a50" stroke-width="2"/><text x="250" y="96" font-size="13" fill="#3d3a50" text-anchor="middle">25</text>
<text x="180" y="114" font-size="10" fill="#7a7392" text-anchor="middle" font-weight="700">18〜49歳は22が基準（総死亡率・発症率が最も低い）</text>
