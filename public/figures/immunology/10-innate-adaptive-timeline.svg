<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="720" height="480" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7a7392" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
  <rect width="360" height="240" fill="#ffffff"/>
  <text x="20" y="34" font-size="11" font-weight="700" fill="#b23a22">感染！</text>
  <rect x="20" y="44" width="160" height="52" rx="12" fill="#ffe4f0" stroke="#e25d97" stroke-width="1.5"/>
  <text x="32" y="66" font-size="14" font-weight="700" fill="#c03272">自然免疫</text>
  <text x="32" y="86" font-size="11.5" fill="#c03272">すぐに働く（数分〜数時間）</text>
  <rect x="150" y="108" width="196" height="52" rx="12" fill="#e1f3ff" stroke="#3a9be0" stroke-width="1.5"/>
  <text x="162" y="130" font-size="14" font-weight="700" fill="#145a8c">獲得免疫</text>
  <text x="162" y="150" font-size="11.5" fill="#1f76b8">数日かかるが、ねらい撃ち</text>
  <line x1="20" y1="180" x2="344" y2="180" stroke="#7a7392" stroke-width="1.6" marker-end="url(#ar)"/>
  <g font-size="11" fill="#7a7392" text-anchor="middle">
    <line x1="20" y1="176" x2="20" y2="184" stroke="#7a7392"/><text x="20" y="198">0</text>
    <line x1="150" y1="176" x2="150" y2="184" stroke="#7a7392"/><text x="150" y="198">数日</text>
    <text x="330" y="198">時間</text>
  </g>
  <text x="20" y="226" font-size="11.5" fill="#3a3350">自然免疫が時間をかせぐ間に、獲得免疫が準備する</text>
