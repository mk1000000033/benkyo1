<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" width="720" height="624" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7a7392" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
  <rect width="360" height="312" fill="#ffffff"/>
  <rect x="105" y="14" width="150" height="54" rx="14" fill="#ffe3dc" stroke="#e58a6e" stroke-width="1.5"/>
  <text x="180" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#a3402a">単球</text>
  <text x="180" y="57" text-anchor="middle" font-size="12" fill="#a3402a">血液中を流れている</text>
  <line x1="180" y1="70" x2="180" y2="104" stroke="#7a7392" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="192" y="92" font-size="12" fill="#7a7392">血管から組織に出ると…</text>
  <rect x="12" y="110" width="336" height="108" rx="16" fill="#f6f2ff" stroke="#9b7bff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#6a48d6">マクロファージの仲間（いる場所で名前が変わる）</text>
  <g font-size="13" font-weight="700" fill="#4a2fb0" text-anchor="middle">
    <rect x="22" y="146" width="100" height="58" rx="12" fill="#ffffff" stroke="#b9a5ff" stroke-width="1.2"/>
    <text x="72" y="170">マクロファージ</text>
    <rect x="130" y="146" width="100" height="58" rx="12" fill="#ffffff" stroke="#b9a5ff" stroke-width="1.2"/>
