  <rect x="50" y="234" width="260" height="62" rx="14" fill="#dff7ee" stroke="#3fbf93" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7a58">ランゲルハンス細胞</text>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#0f7a58">皮膚（表皮）にいる ＝ 樹状細胞の仲間</text>
