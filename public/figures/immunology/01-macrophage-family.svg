    <rect x="238" y="146" width="100" height="58" rx="12" fill="#ffffff" stroke="#b9a5ff" stroke-width="1.2"/>
    <text x="288" y="170">クッパー細胞</text>
  </g>
  <g font-size="12" fill="#6a48d6" text-anchor="middle">
    <text x="72" y="191">全身の組織</text>
    <text x="180" y="191">脳・脊髄</text>
    <text x="288" y="191">肝臓</text>
